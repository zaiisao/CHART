[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vbpm"
version = "0.1.0"
description = "Variational Bar-Pointer Model — staged build against docs/SPEC.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "numpy",
    "scipy",
    "soundfile",
    "mir_eval",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

# Three top-level packages (SPEC boundaries): vbpm is the model library; data is the
# annotation/audio catalog; frontends are the frozen feature extractors. tests/ and
# experiments/ are deliberately NOT packaged — they consume the package.
[tool.setuptools]
packages = ["vbpm", "data", "frontends"]
