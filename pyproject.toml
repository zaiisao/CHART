[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vbpm"
version = "0.1.0"
description = "VBPM: a variational bar-pointer model on frozen fold-honest frontends"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "numpy",
    "scipy",
    "soundfile",
    "mir_eval",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

# ONE package. Inside it: model + hooks modules (mainline/psi) at the top, the data
# layer (data.py catalog+features, songs.py, frontends/), checks/ diagnostics, and
# configs/ YAML recipes. tests live in vbpm/tests and are not shipped.
[tool.setuptools]
packages = ["vbpm", "vbpm.variants", "vbpm.data",
            "vbpm.data.frontends", "vbpm.scoring", "vbpm.checks"]

# The config schema is code, not data: run.py refuses a config without it.
[tool.setuptools.package-data]
vbpm = ["config_schema.json"]
