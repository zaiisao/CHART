[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phasevae"
version = "0.1.0"
description = "Bar-phase VAE: a §7 bar-pointer model on frozen fold-honest frontends"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "numpy",
    "scipy",
    "soundfile",
    "mir_eval",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

# ONE package. Inside it: model + hooks modules (mainline/psi) at the top, the data
# layer (data.py catalog+features, songs.py, frontends/), checks/ diagnostics, and
# configs/ YAML recipes. tests live in phasevae/tests and are not shipped.
[tool.setuptools]
packages = ["phasevae", "phasevae.variants", "phasevae.data",
            "phasevae.data.frontends", "phasevae.scoring", "phasevae.checks"]
