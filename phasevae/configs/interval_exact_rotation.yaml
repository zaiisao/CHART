# The interval emission with the window's rotation promoted to a latent theta, so the
# ELBO is a scalar again and neither detach in `interval` is needed. Rationale and the
# measurements behind every constant: phasevae/variants/interval_exact_rotation.py.
variant: interval_exact_rotation
emission: triangle          # unused by this emission; kept for the shared model ctor
epochs: 60
beta_warmup: 0
b_ratio: 0.1                # Laplace scale on log(model bars per annotated bar)
kappa_place: 100.0          # overwritten each epoch by kappa_anneal
kappa_anneal: "3,300,0.7"   # wide ruler finds the rate, sharp ruler locks the rotation
sigma_ceil: 0.01            # q's per-bar tempo sd; 0.25 makes sign(log r_i) a coin flip
phase_half: 0
interval_kind: laplace
kappa_theta: fold           # A^-1(resultant): q(theta) no sharper than its own evidence
kappa_theta_scale: 1.0      # multiplies the cap (fold) or the concentration (place)
place_expect: true          # exact E_q(theta)[placement] instead of a one-draw estimate
