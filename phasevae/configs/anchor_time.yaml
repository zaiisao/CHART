# baseline.yaml's recipe + the anchor as a discrete TIME grid (variant: anchor_time).
#
# UNMEASURED. No run of this config exists yet. It is the MVP for one hypothesis --
# "enumerating the anchor is what makes the rate learnable" -- and the number to read is
# NOT F but `advance`, which the base recipe pins at its 0.2 clamp against a true
# 0.025-0.063. F cannot separate a bar pointer from a frozen path that happens to cross
# zero in the right places; advance and phase_err can.
#
# Read in this order:
#   Hq -> 1.0            the evidence head is not concentrating; suspect the head, not the
#                        mechanism, and try the warm-start diagnostic arm
#   Hq falls, then
#   advance -> 0.03-0.06 hypothesis confirmed: the anchor gated the rate
#   Hq falls, advance
#   stays at 0.2         placement is fixed and the rate is a SEPARATE breaker; next target
#                        is the saturated emission (kappa pinned at MAX_KAPPA)
#   advance moves first  the causal story is wrong
#
# gtzan decides. The val fold is asap, which is the WORST corpus for this family: 23.9% of
# its windows contain a stretch longer than 1.5 bars with no annotated downbeat (corpus
# median 1.02), and a pointer that emits every bar unconditionally must produce false
# positives there. gtzan's rate is 0.8%. Treat val as a diagnostic, not a verdict.
#
# drift_bound and bar_rate are deliberately ABSENT: they are dead keys that the schema
# still declares, so setting them here would look like configuration and do nothing.
variant: anchor_time
emission: triangle        # elementwise, and required -- build_model asserts it. The
                          # reconstruction is evaluated at every candidate, so a
                          # transformer emission would run B x C sequences per step.
pos_weight: 5.0           # NOT baseline's 1.0, and this is a pricing result rather than a
                          # taste: concentrating q from uniform to a point costs log C_i =
                          # 6.33 nats, and at pos_weight 1.0 the best candidate beats the
                          # candidate average by only 2-4 nats, so the ELBO PREFERS a
                          # uniform q and the enumeration is priced out before it can act
                          # (measured at init across six target periods: 0.3-0.6x the cost,
                          # one case 2.9x). The reconstruction scales with pos_weight and
                          # log C does not: 1.0 -> 0.6x, 5.0 -> 2.8x, 30.0 -> 16.9x. Same
                          # lever, same reason as model.py's own note that phase knowledge
                          # is worth 0.051 nats/frame at pos_weight 1 and 0.754 at 30.
                          # NOTE this makes the objective a weighted surrogate, not a bound.
epochs: 60
beta_warmup: 0            # measured irrelevant without psi (L2 0.496 vs banked 0.505) --
                          # but that was measured on a model with NO anchor term. beta
                          # scales the whole KL including log C_i - H[q], so warmup > 0 is
                          # the other way to make early concentration cheap. Left at 0 to
                          # keep one variable at a time; try 5-10 if Hq stays at 1.0.
anchor_stride_frames: 4   # 80 ms at 50 fps. Half-bin error 40 ms for EVERY item regardless
                          # of tempo or length; 0 of 2893 annotated windows quantize outside
                          # the +-70 ms tolerance.
anchor_harmonics: 8       # M = 1 with fixed weights would be the closed-form circular mean
                          # that already carries 82% with no training; M > 1 learned is the
                          # part that is not already the frontend's.
