# Style enforcement for the v2 tree. Three standards, all binding:
#   - PEP 8 mechanical rules (pycodestyle E/W at the repo's 100-col convention, pyflakes F)
#   - blank-line paragraphing (staycaffeinated 2020-05-27): imports / functions / logical
#     phases separated, get+validate grouped. The E3xx rules enforce the mechanical half;
#     the within-function half is reviewed, not linted.
#   - Google Python Style Guide: docstrings (D, google convention) and naming (N).
# Checked by .githooks/pre-commit locally and .github/workflows/lint.yml on push.

line-length = 100    # deliberate deviation from Google's 80: the whole tree is written to 100

[lint]
select = ["E", "W", "F", "D", "N"]
# Vertical whitespace (Google SS3.5): the E30x blank-line rules and W391 are preview-gated
# in ruff; explicit-preview-rules activates ONLY the ones named here, nothing else.
preview = true
explicit-preview-rules = true
extend-select = ["E301", "E302", "E303", "E304", "E305", "E306", "W391"]
ignore = [
    "N806", "N803", "N812",  # Google SS3.16 sanctions domain-standard short names; in ELBO
                             # code W/K/T/H and `import reference as R` ARE the clear names
    "D107",                  # __init__ is documented in the class docstring (Google style)
    "D105",                  # magic methods (__repr__ etc.) need no docstring
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# tests is the acceptance suite and may not be edited (SPEC SS9): style rules that would
# require touching it are exempted there, nothing else.
"tests/mutants.py" = ["E501"]
"tests/test_reference_selftest.py" = ["E501"]
"tests/*" = ["D", "N"]
# experiments are one-off measurement scripts: docstring FORMAT is enforced, but small
# internal helpers need not carry docstrings
"experiments/*" = ["D1"]
