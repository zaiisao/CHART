# THE DEFAULT RECIPE. baseline.yaml + the categorical anchor head (variant: anchor_k).
# Everything except the variant and its slot count is baseline.yaml verbatim.
#
# gtzan rule-g F 0.752, AMLt 0.929 (n=993, seed 0, dev protocol) vs baseline 0.393-0.468.
# What that gain IS, measured by swapping ONLY the deployment read-out on frozen weights
# (anchor_swap.py): +0.232 of it is the anchor read-out and needs no training at all --
# the baseline's own weights reach F 0.700 with a zero-parameter circular mean of the
# frontend's downbeat channel folded under mu. The remaining ~0.05 is what the learned
# k head adds on co-adapted weights. So k is NOT what makes this work; the head's INPUT
# (phase-folded activations rather than a frame-0 trunk snapshot) is.
#
# Ceiling on the same frozen weights with an ORACLE anchor (placed from annotations,
# not deployable): F 0.872. The anchor estimator, not the objective, is still the
# dominant lever. Single seed, dev protocol; folds+seeds owed before any external claim.
variant: anchor_k
emission: triangle
pos_weight: 1.0
epochs: 60
beta_warmup: 0
anchor_slots: 64
