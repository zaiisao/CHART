# The recipe every 2026-08-15/16 run actually used: interval.yaml plus the six
# --set flags that were passed on every command line. Written down so the run is
# reproducible from the config alone.
#
#   place_coord: mean   mid-window drift costs 0.00 nats at the t1 anchor and
#                       44.04 at the circular mean -- the emission was blind
#   place_lift: 1.0     routes the knot corrections into the placement factor with
#                       the RATE detached, so placement can price a corrector slide
#   walk_kind: gated    crossing-gated walk: one cheap tempo jump per bar line
#   kappa_gate: true    the phase-side twin, kappa_p = KAPPA_INTER at crossings
#   delta_on: true      q(phi_t) gets a free mean (the update step)
#   gate_cond: true     the delta head reads the gate; without it one shared head
#                       faces 1e5 on 79% of knots and delta pins to zero
variant: interval
emission: triangle
epochs: 60
beta_warmup: 0
b_ratio: 0.1
kappa_place: 100.0
kappa_anneal: "3,300,0.7"
kappa_physical: 100000.0
phase_half: 0
interval_kind: huber
dec_warmup: 15
walk_kind: gated
kappa_gate: true
place_coord: mean
place_lift: 1.0
place_attach: false
delta_on: true
gate_cond: true
