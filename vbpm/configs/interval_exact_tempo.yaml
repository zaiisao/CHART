# The tempo latent lives on a FIXED grid of block_frames-frame blocks, so its dimension
# no longer depends on the tempo: entropy and walk are exact sums over the same K terms.
# Rationale and the measurement behind BLOCK_WALK_MIX:
# vbpm/variants/interval_exact_tempo.py.
variant: interval_exact_tempo
emission: triangle          # unused by this emission; kept for the shared model ctor
epochs: 60
beta_warmup: 0
b_ratio: 0.1                # Laplace scale on log(model bars per annotated bar)
kappa_place: 100.0          # overwritten each epoch by kappa_anneal
kappa_anneal: "3,300,0.7"   # wide ruler finds the rate, sharp ruler locks the rotation
sigma_ceil: 0.25            # the module default: the 0.01 band-aid is no longer needed
phase_half: 0
interval_kind: laplace
block_frames: 50            # 1 s at 50 fps -> 45 latents in a 45 s window
block_interp: true          # linear between block centres; false holds the block value
