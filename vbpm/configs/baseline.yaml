# THE recipe: the interval observation model with the crossing gate and the update
# step. This is what run.py defaults to and what the launch configs point at.
#
# The observation is the annotated downbeat TIMES scored by two distance-aware
# rulers, not a per-frame Bernoulli over the widened indicator. Rationale and the
# measurements behind every constant: vbpm/variants/interval.py.
#
#   place_coord: mean   mid-window drift costs 0.00 nats at the t1 anchor and
#                       44.04 at the circular mean -- the emission was blind
#   place_lift: 1.0     routes the knot corrections into the placement factor with
#                       the RATE detached, so placement can price a corrector slide
#   walk_kind: gated    crossing-gated walk: one cheap tempo jump per bar line
#   kappa_gate: true    the phase-side twin, kappa_p = KAPPA_INTER at crossings
#   delta_on: true      q(phi_t) gets a free mean (the update step). NOT yet shown
#                       to help: its one good run did not replicate at the same seed
#   gate_cond: true     the delta head reads the gate; without it one shared head
#                       faces 1e5 on 79% of knots and delta pins to zero
variant: interval
emission: triangle          # unused by this emission; kept for the shared model ctor
epochs: 60
beta_warmup: 0
b_ratio: 0.1                # Laplace scale on log(model bars per annotated bar)
kappa_place: 100.0          # overwritten each epoch by kappa_anneal
kappa_anneal: "3,300,0.7"   # wide ruler finds the rate, sharp ruler locks the rotation
kappa_physical: 100000.0    # 383 lets the accumulating innovations random-walk the phase
phase_half: 0
interval_kind: huber
dec_warmup: 15
walk_kind: gated
kappa_gate: true
place_coord: mean
place_lift: 1.0
place_attach: false
delta_on: true
gate_cond: true
